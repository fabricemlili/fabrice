[project]
name = "python-files"
version = "0.1.0"
description = "Polymarket WebSocket streams and Telegram weather bot"
readme = "README.md"
authors = [
    { name = "fabricemlili", email = "fmlili@hotmail.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "dotenv>=0.9.9",
    "websockets>=17.0.1",
]

[project.scripts]
polymarket-perps = "python_files.polymarket.perps_stream:main"
polymarket-twap = "python_files.polymarket.twap_stream:main"
polymarket-record = "python_files.polymarket.sqlite_batch_writer:main"
telegram-weather-bot = "python_files.telegram_weather.bot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
